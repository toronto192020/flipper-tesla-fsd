---
name: Deploy and Publish

"on":
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release artifact
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag to publish (required when publish=true, e.g. v2.15.0)
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: deploy-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository layout
        run: |
          test -f application.fam
          test -f esp32/platformio.ini

  deploy:
    needs: bootstrap
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build ESP32 firmware (m5stack-atom)
        run: pio run -e m5stack-atom

      - name: Collect deployable artifact
        run: |
          mkdir -p ../dist
          cp .pio/build/m5stack-atom/firmware.bin \
            ../dist/tesla-fsd-esp32-m5stack-atom.bin

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesla-fsd-esp32-m5stack-atom
          path: ../dist/tesla-fsd-esp32-m5stack-atom.bin
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual release input
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          test -n "${{ inputs.release_tag }}"
          case "${{ inputs.release_tag }}" in
            v*) ;;
            *) echo "release_tag must start with 'v'" >&2; exit 1 ;;
          esac

      - name: Download deploy artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: tesla-fsd-esp32-m5stack-atom
          path: dist

      - name: Publish GitHub release artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: dist/tesla-fsd-esp32-m5stack-atom.bin
          generate_release_notes: true
